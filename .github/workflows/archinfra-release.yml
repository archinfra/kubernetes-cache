name: Archinfra Kubernetes Cache Release

on:
  push:
    branches:
      - main
    paths:
      - "archinfra/**"
      - ".github/workflows/archinfra-release.yml"
  workflow_dispatch:
    inputs:
      component:
        description: Component cache to build
        required: true
        default: all
        type: choice
        options:
          - all
          - sealos
          - docker
          - crictl
          - kubernetes

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: archinfra-kubernetes-cache-v1.36.4-r1
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}
  RELEASE_FILE: ${{ github.workspace }}/archinfra/releases/v1.36.4-r1.env

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n archinfra/scripts/common.sh
          bash -n archinfra/scripts/build-sealos.sh
          bash -n archinfra/scripts/build-docker.sh
          bash -n archinfra/scripts/build-crictl.sh
          bash -n archinfra/scripts/build-kubernetes.sh
          cat archinfra/releases/v1.36.4-r1.env

  sealos:
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'sealos' }}
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Sealos cache
        run: bash archinfra/scripts/build-sealos.sh

      - name: Upload provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-sealos-provenance
          path: out/
          if-no-files-found: warn

  docker:
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'docker' }}
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker runtime cache
        run: bash archinfra/scripts/build-docker.sh

      - name: Upload provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-docker-provenance
          path: out/
          if-no-files-found: warn

  crictl:
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'crictl' }}
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build crictl cache
        run: bash archinfra/scripts/build-crictl.sh

      - name: Upload provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-crictl-provenance
          path: out/
          if-no-files-found: warn

  kubernetes:
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'kubernetes' }}
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Sealos build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            buildah \
            skopeo \
            uidmap \
            fuse-overlayfs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Kubernetes cache
        run: bash archinfra/scripts/build-kubernetes.sh

      - name: Upload provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-kubernetes-provenance
          path: out/
          if-no-files-found: warn
