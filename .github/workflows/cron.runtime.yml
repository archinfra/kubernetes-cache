jobs:
  caching:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Login to registry Hub
        uses: docker/login-action@v2
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.repository_owner }}
      - env:
          ARCH: ${{ matrix.arch }}
          REGISTRY: ghcr.io
          REPOSITORY: ${{ github.repository }}
        name: push to registry Hub
        run: bash .github/scripts/runtime --release "${{ inputs.release }}"
    strategy:
      matrix:
        arch:
          - amd64
name: runtime-upstream-reference
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release BOM to pin (archinfra/releases/<release>.env). Leave empty to keep upstream "latest".'
        required: false
        default: 'v1.36.4-r2'
